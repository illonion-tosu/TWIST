name: Lint and Fix

on:
    pull_request:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    lint:
        runs-on: ubuntu-latest

        env:
            HEAD_REF: ${{ github.head_ref }}
            FIX_BRANCH: lint-fixes/${{ github.head_ref }}

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Checkout lint configs
              run: |
                  git clone https://x-access-token:${{ secrets.CONFIG_REPO_PAT }}@github.com/illonion/lint-configs.git ../lint-configs

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install linters globally
              run: |
                  npm install --global eslint htmlhint stylelint stylelint-config-standard

            - name: Auto-fix CSS
              id: css_fix
              continue-on-error: true
              run: |
                  stylelint "**/*.css" \
                    --config ../lint-configs/.stylelintrc.json \
                    --fix

            - name: Auto-fix JavaScript
              id: js_fix
              continue-on-error: true
              run: |
                  eslint "**/*.js" \
                    --config ../lint-configs/eslint.config.js \
                    --fix

            - name: Lint HTML
              id: html_lint
              continue-on-error: true
              run: |
                  htmlhint "**/*.html" \
                    --config ../lint-configs/.htmlhintrc

            - name: Report lint results
              if: always()
              run: |
                  echo "Lint results:"
                  echo "  CSS:  ${{ steps.css_fix.outcome }}"
                  echo "  JS:   ${{ steps.js_fix.outcome }}"
                  echo "  HTML: ${{ steps.html_lint.outcome }}"

            - name: Check for changes
              id: changes
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Delete previous fix branch if it exists
              if: steps.changes.outputs.changed == 'true'
              run: |
                  if git ls-remote --exit-code --heads origin "$FIX_BRANCH" >/dev/null 2>&1; then
                      echo "Deleting existing remote branch $FIX_BRANCH"
                      git push origin --delete "$FIX_BRANCH"
                  else
                      echo "No existing fix branch to delete"
                  fi

            - name: Create fix branch and commit
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git checkout -b "$FIX_BRANCH"
                  git add -A
                  git commit -m "lint: auto-fix style issues"

            - name: Push fix branch
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git push origin "$FIX_BRANCH"

            - name: Create new PR
              if: steps.changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh pr create \
                    --base "$HEAD_REF" \
                    --head "$FIX_BRANCH" \
                    --title "Automated lint fixes for $HEAD_REF" \
                    --body "This PR was automatically created by GitHub Actions after running lint autofixes on the current PR branch.

                  Lint results:
                  - CSS: ${{ steps.css_fix.outcome }}
                  - JS: ${{ steps.js_fix.outcome }}
                  - HTML: ${{ steps.html_lint.outcome }}"

            - name: Final lint check
              run: |
                  echo "Running final lint verification..."

                  stylelint "**/*.css" \
                    --config ../lint-configs/.stylelintrc.json

                  eslint "**/*.js" \
                    --config ../lint-configs/eslint.config.js

                  htmlhint "**/*.html" \
                    --config ../lint-configs/.htmlhintrc