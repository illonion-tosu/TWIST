<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameplay</title>

    <link rel="stylesheet" href="../_shared/css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <!-- Team Name Left  -->
        <svg
            class="team-name-container team-name-container-left"
            xmlns="http://www.w3.org/2000/svg"
            width="600"
            height="104"
            viewBox="0 0 600 104"
        >
            <!-- White outer stroke -->
            <text
                x="47"
                y="78"
                text-anchor="left"
                font-size="55px"
                letter-spacing="-4"
                font-family="Super Mario Galaxy"
                stroke="white"
                stroke-width="8px"
                stroke-linejoin="round"
                fill="white"
                class="team-name-left"
            >
                AAAAAAAAAAAAAAAAAA
            </text>

            <!-- Red outer stroke -->
            <text
                x="47"
                y="78"
                text-anchor="left"
                font-size="55px"
                letter-spacing="-4"
                font-family="Super Mario Galaxy"
                stroke="#ff0000"
                stroke-width="4px"
                stroke-linejoin="round"
                fill="white"
                class="team-name-left"
            >
                AAAAAAAAAAAAAAAAAA
            </text>
        </svg>

        <!-- Team Name Right  -->
        <svg
            class="team-name-container team-name-container-right"
            xmlns="http://www.w3.org/2000/svg"
            width="600"
            height="104"
            viewBox="0 0 600 104"
        >
            <!-- White outer stroke -->
            <text
                x="553"
                y="78"
                text-anchor="end"
                font-size="55px"
                letter-spacing="-4"
                font-family="Super Mario Galaxy"
                stroke="white"
                stroke-width="8px"
                stroke-linejoin="round"
                fill="white"
                class="team-name-right"
            >
                AAAAAAAAAAAAAAAAAA
            </text>

            <!-- Red outer stroke -->
            <text
                x="553"
                y="78"
                text-anchor="end"
                font-size="55px"
                letter-spacing="-4"
                font-family="Super Mario Galaxy"
                stroke="#0078ff"
                stroke-width="4px"
                stroke-linejoin="round"
                fill="white"
                class="team-name-right"
            >
                AAAAAAAAAAAAAAAAAA
            </text>
        </svg>
    </div>

    <script src="index.js" type="module"></script>
</body>
