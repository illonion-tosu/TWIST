<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="../_shared/css/style.css">
    <link rel="stylesheet" href="style.css">

    <script src="../_shared/deps/reconnecting-websocket.min.js"></script>
</head>
<body>
    <div class="dashboard-section">
        <h1>Match: <span class="team-red-colour">KIM HYUJIN</span> vs <span class="team-blue-colour">KIM HYUJIN</span></h1>
        <div class="auto-section">
            <label class="auto-labels">
                <input type="checkbox">
                <span>Auto Pick + Winners</span>
            </label>
            <label class="auto-labels">
                <input type="checkbox">
                <span>Toggle Stars</span>
            </label>
            <label class="auto-labels">
                <input type="checkbox">
                <span>Auto OBS Scenes</span>
            </label>
        </div>
    </div>
    <div class="match-details-section">
        <h1>Match Details</h1>
        <div class="match-details">
            <div>Round Name: <span>Round of 16</span></div>|
            <div>Current Map: <span>STAYC - SO BARjAADJKsadfhjkashjkhasdfkjhasdjk</span></div>|
            <div>Current Mod ID: <span>DT2</span></div>
        </div>
    </div>
    <div class="points-container">Points:<br>
        <div class="team-points-container team-points-red">
            <div class="team-points team-red-colour">RED: <span id="team-red-points">0</span></div>
            <button>+</button>
            <button>-</button>
        </div>
        <div class="team-points-container team-points-blue">
            <div class="team-points team-blue-colour">BLUE: <span id="team-blue-points">0</span></div>
            <button>+</button>
            <button>-</button>
        </div>
    </div>
    <script src="index.js" type="module"></script>
</body>
</html>
